<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=footer-links-up">
</head>
<body class="footer-document">
  <footer class="site-footer">
    <div class="footer-brand-block">
      <span class="footer-mark">TCF</span>
      <p class="footer-tagline"><span>Two Missions One Purpose</span><span>Helping People Move Forward</span></p>
    </div>
    <div class="footer-info-block">
      <p>Food support, education support, and mentoring pathways for New Hampshire communities.</p>
      <p class="footer-legal">&copy; Copyright 2026 Tyls Foundation, a nonprofit 501(c)(3) organization. Tax ID number 33-2773487. All Rights Reserved.</p>
      <p class="footer-legal-links"><a href="../privacy-policy.html" target="_top">Privacy Policy</a><a href="../site-map.html" target="_top">Site Map</a></p>
    </div>
  </footer>
  <script>
    const currentPage = window.parent.location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll(".footer-legal-links a").forEach((link) => {
      if (link.getAttribute("href")?.endsWith(currentPage)) {
        link.setAttribute("aria-current", "page");
      }
    });
  </script>
</body>
</html>
